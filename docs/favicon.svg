<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Favicon variant of docs/icon.svg: same hub-and-spoke mark with the
       dashed zone ring dropped and everything scaled up, because at 16px the
       ring turns to mush and the nodes need the room. -->
  <rect width="64" height="64" rx="14" fill="#1a1d22"/>
  <g stroke="#8b949e" stroke-width="4.5" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="15"/>
    <line x1="32" y1="32" x2="17" y2="41"/>
    <line x1="32" y1="32" x2="47" y2="41"/>
  </g>
  <g fill="#e8eaed">
    <circle cx="32" cy="15" r="7"/>
    <circle cx="17" cy="41" r="7"/>
    <circle cx="47" cy="41" r="7"/>
  </g>
  <circle cx="32" cy="32" r="10.5" fill="#f6821f" stroke="#1a1d22" stroke-width="2.5"/>
</svg>
